name: Notificación DevOps

on:
  push:
    branches:
      - main

jobs:
  notificar:
    runs-on: ubuntu-latest

    steps:
      - name: Enviar notificación a ntfy
        run: |
          curl -H "Title: GitHub Actions" \
               -H "Content-Type: text/plain" \
               -d "Hola Mundo - Se realizó un push al repositorio en la rama main" \
               https://ntfy.sh/devops-itla
